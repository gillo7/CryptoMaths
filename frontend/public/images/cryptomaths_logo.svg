<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .mark-bg { fill: #14213D; }
      .mark-accent { fill: #C9A227; }
      .word-crypto { font-family: 'Georgia', 'Iowan Old Style', serif; font-weight: 700; fill: #14213D; }
      .word-maths { font-family: 'Georgia', 'Iowan Old Style', serif; font-weight: 700; fill: #C9A227; }
      .tagline { font-family: 'Courier New', monospace; fill: #5C6B7A; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Hexagon lattice mark: six lattice nodes forming the module-lattice unit, with a keyhole notch -->
  <g transform="translate(100,100)">
    <polygon class="mark-bg" points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" />

    <!-- lattice grid points inside, echoing the module-lattice structure -->
    <g fill="#F6F1E7" opacity="0.85">
      <circle cx="0" cy="-35" r="4.5" />
      <circle cx="30.3" cy="-17.5" r="4.5" />
      <circle cx="30.3" cy="17.5" r="4.5" />
      <circle cx="0" cy="35" r="4.5" />
      <circle cx="-30.3" cy="17.5" r="4.5" />
      <circle cx="-30.3" cy="-17.5" r="4.5" />
    </g>
    <g stroke="#F6F1E7" stroke-width="1.4" opacity="0.5">
      <line x1="0" y1="-35" x2="0" y2="0" />
      <line x1="30.3" y1="-17.5" x2="0" y2="0" />
      <line x1="30.3" y1="17.5" x2="0" y2="0" />
      <line x1="0" y1="35" x2="0" y2="0" />
      <line x1="-30.3" y1="17.5" x2="0" y2="0" />
      <line x1="-30.3" y1="-17.5" x2="0" y2="0" />
    </g>

    <!-- keyhole at the centre, replacing the central lattice node: the key sits at the heart of the lattice -->
    <circle class="mark-accent" cx="0" cy="-5.5" r="9" />
    <polygon class="mark-accent" points="-4,-3.5 4,-3.5 7,14.5 -7,14.5" />
  </g>

  <!-- Wordmark -->
  <text x="200" y="92" font-size="46" class="word-crypto">Crypto<tspan class="word-maths">Maths</tspan></text>
  <text x="202" y="122" font-size="15" class="tagline">learn cryptography by using it</text>
</svg>
